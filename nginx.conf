# Plain round-robin across all `app` replicas (Docker DNS returns every replica's IP).
# No sticky sessions: session state lives in MongoDB.
upstream app {
  server app:3000;
  keepalive 16;
}

server {
  listen 8080;
  server_tokens off;
  client_max_body_size 1m;

  location / {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Demo aid: shows which replica served the request. Remove in production.
    add_header X-Upstream $upstream_addr always;
  }
}
